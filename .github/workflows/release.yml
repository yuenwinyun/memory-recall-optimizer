name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional git tag to publish (e.g. v0.1.1). If empty, uses current HEAD."
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Checkout tagged ref for manual release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        run: |
          git fetch --tags --force
          git checkout "${{ github.event.inputs.release_tag }}"

      - name: Install dependencies
        run: |
          corepack enable
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack pnpm install --frozen-lockfile
          else
            corepack pnpm install --no-frozen-lockfile
          fi

      - name: Validate token
        run: |
          test -n "$NODE_AUTH_TOKEN" || {
            echo "NPM_TOKEN secret is required. Add it in Settings > Secrets and Variables > Actions."
            exit 1
          }

      - name: Configure npm auth
        run: npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"

      - name: Verify npm auth
        run: |
          npm whoami --registry https://registry.npmjs.org || {
            echo "NPM_TOKEN is missing, invalid, or lacks publish permission."
            exit 1
          }

      - name: Run tests
        run: npm run test

      - name: Dry publish check
        run: npm publish --access public --dry-run

      - name: Publish package
        run: npm publish --access public
